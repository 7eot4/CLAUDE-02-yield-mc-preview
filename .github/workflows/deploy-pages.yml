name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # metadataBase (app/layout.tsx) resolves relative OpenGraph/Twitter
          # image URLs against this - without it, Next falls back to its
          # localhost:3000 dev default, which is what shipped to production
          # in og:image tags until this was caught by checking the live
          # page's actual meta tags, not just that the build succeeded.
          # Deliberately the bare origin, NOT including /CLAUDE-02-yield-mc-preview -
          # withBasePath() (lib/env.ts) already adds that repo-name prefix to
          # the image path itself, so including it here too doubled the
          # prefix (caught the same way, by re-checking live output after
          # the first fix attempt).
          NEXT_PUBLIC_SITE_URL: 'https://7eot4.github.io'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
